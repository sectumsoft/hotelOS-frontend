name: CI

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (qa config — matches the deploy target)
        run: npm run build:qa
